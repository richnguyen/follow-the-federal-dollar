# Builds the standalone site and publishes it to GitHub Pages on every push to main.
# The standalone build refreshes the national debt and the latest monthly Treasury
# figures live in each visitor's browser; everything else uses the data in src/data/.
#
# Action versions run natively on Node.js 24 (the Node 20 majors print deprecation warnings,
# such as DEP0040 for `punycode`, when the runner forces them onto Node 24).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      # GitHub's Pages service sometimes stalls ("updating_pages") or answers with a server
      # error. Wait the full 10 minutes it allows, and if it fails, pause a minute and try once more.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000
      - if: steps.deployment.outcome == 'failure'
        run: sleep 60
      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
